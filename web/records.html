<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TF-Tracker – Data sheet</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#2b1d14;--mut:#7a6a5e;--ac:#c2410c;--ln:#e7dccf;--g:#1faa7a}
@media(prefers-color-scheme:dark){:root{--bg:#14110f;--card:#1f1a17;--ink:#f3ebe3;--mut:#a89888;--ln:#3a312b}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.logo i{width:34px;height:34px;border:2px solid var(--ac);border-radius:50%;display:grid;place-items:center;font-style:normal;color:var(--ac);font-size:12px}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}nav a,nav span{padding:8px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer;font-size:14px}nav a.on{background:#f1e4d8;color:var(--ac)}
main{padding:16px;max-width:1400px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:14px}
.c h2{margin:0 0 10px;font-size:13px;letter-spacing:.05em;color:var(--ac);text-transform:uppercase}
.f{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.f label{font-size:11px;color:var(--mut);display:grid;gap:2px}
input,select{padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer;font-size:13px}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}button.g{background:var(--g)}button.d{background:#c62828}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--ln);padding:5px 8px;text-align:center;white-space:nowrap}th{background:#f1e4d8;color:#2b1d14;font-size:11px}
td.ac{display:flex;gap:5px;justify-content:center;border:0;border-top:1px solid var(--ln)}
.tag{font-size:11px;padding:2px 8px;border-radius:9px;background:#ffe3d6;color:#2b1d14}.tag.ok{background:#dff5ec}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;padding:16px;overflow:auto}.hide{display:none!important}
.ov>form{max-width:520px;margin:30px auto;display:grid;gap:10px}.ov label{font-size:12px;color:var(--mut);display:grid;gap:3px}
.info{font-size:13px;background:#f1e4d8;color:#2b1d14;padding:8px 10px;border-radius:8px}
small{color:var(--mut)}
</style></head><body>
<header><div class="logo"><i>TF</i>TF-Tracker</div>
<nav><a href="index.html">📊 Summary</a><a class="on">🗂 Data sheet</a><span id="who"></span><a id="lo">Logout</a></nav></header>
<main>
<div id="err" class="c hide" style="color:#c62828"></div>
<div id="app" class="hide">
<div class="c"><div class="f">
<label>Date<input type="date" id="d"></label>
<button class="s" id="prev">◀</button><button class="s" id="today">Today</button><button class="s" id="next">▶</button>
<label id="wl">Workshop<select id="ws"></select></label>
<label style="grid-auto-flow:column;align-items:center;gap:6px;font-size:13px;color:var(--ink)"><input type="checkbox" id="pend"> Also show all pending (not issued / replaced / returned)</label>
<button id="add" class="g">＋ Add PR entry</button>
</div></div>
<div class="c"><h2 id="ttl">Entries</h2><div class="tw"><table id="tb"></table></div><p id="msg"><small></small></p></div>
<div id="um" class="c hide"><h2>Users &amp; rights (admin only)</h2>
<div class="tw"><table id="ut"></table></div>
<form id="uf" class="f" style="margin-top:12px">
<label>Email<input id="ue" type="email" required></label>
<label>Password<input id="up" type="text" minlength="6" required></label>
<label>Rights<select id="ur"><option value="je">JE / AE (own workshop)</option><option value="admin">Admin (all workshops)</option></select></label>
<label>Workshop<select id="uw"></select></label>
<button>Add user</button></form><small id="um2"></small></div>
</div>
</main>
<div id="fm" class="ov hide"><form id="ff" class="c"><h2 id="ft"></h2><div id="fi" class="info hide"></div><div id="ff2" style="display:grid;gap:10px"></div>
<div class="f"><button>Save</button><button type="button" class="s" id="fc">Cancel</button></div></form></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const C=window.APP_CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY),$=s=>document.querySelector(s);
const WS=["AZAMGARH","BALLIA","MAU"],CAP=[10,16,25,63,100,160,250,400,630];
/* Columns shown in the "Add PR entry" form. If your table has more columns that the JE must fill
   (e.g. "pr_no","dt_no","village"), add their exact column names below. */
const FIELDS=["workshop","capacity_kva","pr_date"];
const STAGES=[["issue_date","Issue","issue"],["replacement_date","Replace","replace"],["tx_return_date","Return","return"]];
const HIDDEN=["id","created_at","updated_at"];
const ld=d=>{const z=new Date(d-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const fd=s=>s?s.split("-").reverse().join("."):"";
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lab=k=>k.replace(/_/g," ").toUpperCase();
let me=null,rows=[],cols=[];
$("#d").value=ld(new Date());
function show(m){$("#err").textContent=m;$("#err").classList.remove("hide")}
async function init(){
 const{data:{session}}=await sb.auth.getSession();if(!session){location.href="index.html";return}
 const{data:p,error}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
 if(error){show("Error: "+error.message);return}
 if(!p){show("You are signed in as "+session.user.email+" but have no access yet. Ask the admin to add you.");return}
 me=p;me.email=session.user.email;
 $("#who").textContent=`${me.email} · ${me.role==="admin"?"Admin":"JE/AE "+(me.workshop||"")}`;
 $("#app").classList.remove("hide");
 $("#ws").innerHTML=`<option value="">ALL</option>`+WS.map(w=>`<option>${w}</option>`).join("");
 $("#uw").innerHTML=WS.map(w=>`<option>${w}</option>`).join("");
 if(me.role!=="admin")$("#wl").classList.add("hide");else{$("#um").classList.remove("hide");loadUsers()}
 load()}
async function load(){
 const d=$("#d").value;$("#msg").firstChild.textContent="Loading…";
 let q=sb.from("transformer_cases").select("*").order("id").limit(1000);
 q=$("#pend").checked?q.or(`pr_date.eq.${d},issue_date.is.null,replacement_date.is.null,tx_return_date.is.null`):q.eq("pr_date",d);
 const w=me.role==="admin"?$("#ws").value:me.workshop;if(w)q=q.eq("workshop",w);
 const{data,error}=await q;if(error){$("#msg").firstChild.textContent="Error: "+error.message;return}
 rows=data;$("#msg").firstChild.textContent=rows.length?"":"No entries for this date.";render()}
function render(){
 const ks=[...new Set([...FIELDS,...rows.flatMap(r=>Object.keys(r))])].filter(k=>!HIDDEN.includes(k));
 cols=ks;$("#ttl").textContent=`Entries – ${fd($("#d").value)}${$("#pend").checked?" + pending":""} (${rows.length})`;
 $("#tb").innerHTML=`<tr><th>#</th>${ks.map(k=>`<th>${lab(k)}</th>`).join("")}<th>Status</th><th>Action</th></tr>`+
 rows.map((r,i)=>{const nx=STAGES.find(s=>!r[s[0]]);
  return`<tr><td>${i+1}</td>${ks.map(k=>`<td>${/_date$/.test(k)?fd(r[k]):esc(r[k])}</td>`).join("")}
  <td>${nx?`<span class="tag">Pending ${nx[1].toLowerCase()}</span>`:`<span class="tag ok">Completed</span>`}</td>
  <td class="ac">${nx?`<button class="g" onclick="stage(${i})">${nx[1]}</button>`:""}<button class="s" onclick="edit(${i})">Edit</button>${me.role==="admin"?`<button class="d" onclick="del(${i})">Del</button>`:""}</td></tr>`}).join("")}
function field(k,v){
 const dis=k==="workshop"&&me.role!=="admin"?"disabled":"";
 if(k==="workshop")return`<label>${lab(k)}<select name="${k}" ${dis} required>${WS.map(w=>`<option ${w===(v||me.workshop)?"selected":""}>${w}</option>`).join("")}</select></label>`;
 if(k==="capacity_kva")return`<label>${lab(k)}<select name="${k}" required><option value="">--</option>${CAP.map(c=>`<option ${c==v?"selected":""}>${c}</option>`).join("")}</select></label>`;
 return`<label>${lab(k)}<input name="${k}" type="${/_date$/.test(k)?"date":"text"}" value="${esc(v)}"></label>`}
function form(title,html,info,save){
 $("#ft").textContent=title;$("#ff2").innerHTML=html;
 $("#fi").classList.toggle("hide",!info);$("#fi").innerHTML=info||"";
 $("#fm").classList.remove("hide");
 $("#ff").onsubmit=async e=>{e.preventDefault();const o={};
  new FormData($("#ff")).forEach((v,k)=>o[k]=v===""?null:v);
  if(me.role!=="admin"&&"workshop" in o||$("#ff [name=workshop]")?.disabled)o.workshop=me.workshop;
  if(o.capacity_kva)o.capacity_kva=Number(o.capacity_kva);
  const{error}=await save(o);if(error){alert(error.message);return}
  $("#fm").classList.add("hide");load()}}
$("#fc").onclick=()=>$("#fm").classList.add("hide");
$("#add").onclick=()=>form("Add PR entry",FIELDS.map(k=>field(k,k==="pr_date"?$("#d").value:k==="workshop"?(me.role==="admin"?$("#ws").value:me.workshop):"")).join(""),"",o=>sb.from("transformer_cases").insert(o));
window.edit=i=>{const r=rows[i];form("Edit entry",cols.map(k=>field(k,r[k])).join(""),"",o=>sb.from("transformer_cases").update(o).eq("id",r.id))};
window.del=async i=>{if(!confirm("Delete this entry?"))return;const{error}=await sb.from("transformer_cases").delete().eq("id",rows[i].id);if(error)alert(error.message);else load()};
window.stage=i=>{const r=rows[i],s=STAGES.find(x=>!r[x[0]]),by=Object.keys(r).filter(k=>k.includes(s[2])&&k.endsWith("_by"));
 const info=`<b>${s[1]} details (auto-filled)</b><br>Workshop: ${esc(r.workshop)} · Capacity: ${esc(r.capacity_kva)} kVA · PR date: ${fd(r.pr_date)}`+
  cols.filter(k=>!FIELDS.includes(k)&&!/_date$/.test(k)&&!k.endsWith("_by")&&r[k]!=null).map(k=>` · ${lab(k)}: ${esc(r[k])}`).join("");
 form(s[1]+" transformer",field(s[0],ld(new Date()))+by.map(k=>field(k,me.email)).join(""),info,o=>sb.from("transformer_cases").update(o).eq("id",r.id))};
["d","ws","pend"].forEach(i=>$("#"+i).onchange=load);
const mv=n=>{const x=new Date($("#d").value);x.setDate(x.getDate()+n);$("#d").value=ld(x);load()};
$("#prev").onclick=()=>mv(-1);$("#next").onclick=()=>mv(1);$("#today").onclick=()=>{$("#d").value=ld(new Date());load()};
$("#lo").onclick=async()=>{await sb.auth.signOut();location.href="index.html"};
/* ---- Users (admin) ---- */
async function loadUsers(){
 const{data,error}=await sb.from("profiles").select("*").order("email");if(error){$("#um2").textContent=error.message;return}
 $("#ut").innerHTML=`<tr><th>Email</th><th>Rights</th><th>Workshop</th><th>Action</th></tr>`+data.map(u=>`<tr><td>${esc(u.email)}</td><td>${u.role==="admin"?"Admin":"JE/AE"}</td><td>${esc(u.workshop||"ALL")}</td><td class="ac"><button class="d" onclick="rmUser('${u.id}')">Remove access</button></td></tr>`).join("")}
window.rmUser=async id=>{if(!confirm("Remove this user's access?"))return;const{error}=await sb.from("profiles").delete().eq("id",id);if(error)alert(error.message);else loadUsers()};
$("#uf").onsubmit=async e=>{e.preventDefault();$("#um2").textContent="Creating…";
 const sb2=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:"tf-temp"}});
 const em=$("#ue").value.trim(),{data,error}=await sb2.auth.signUp({email:em,password:$("#up").value});
 if(error){$("#um2").textContent="Error: "+error.message;return}
 const role=$("#ur").value,{error:e2}=await sb.from("profiles").upsert({id:data.user.id,email:em,role,workshop:role==="admin"?null:$("#uw").value});
 if(e2){$("#um2").textContent="Error: "+e2.message;return}
 $("#um2").textContent="User added. Share the email and password with them.";$("#uf").reset();loadUsers()};
init();
</script></body></html>
