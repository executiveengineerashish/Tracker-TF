<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transformer Tracking</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#e4e7ec;--brand:#0b5fa5;--brand-ink:#fff;
--ok:#16794c;--warn:#b54708;--bad:#b42318;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151c;--card:#171e28;--ink:#e6eaf0;--mute:#98a2b3;--line:#27313f;--brand:#4da3ee;--brand-ink:#08121d;--ok:#52c48a;--warn:#f5a259;--bad:#f27a70;--chip:#1f2935}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1 1 240px}
nav{display:flex;gap:4px}nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--mute);font:inherit;cursor:pointer}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
main{padding:16px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.kpi span{color:var(--mute);font-size:12px}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
button.btn{font:inherit;background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.btn.sec{background:var(--chip);color:var(--ink)}button.btn:disabled{opacity:.5}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,td.l,th.l{text-align:left}th{font-size:12px;color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
tr.tot td{font-weight:700;background:var(--chip)}tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--chip)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--chip);font-size:12px}
.neg{color:var(--bad);font-weight:600}
#login{max-width:340px;margin:12vh auto;text-align:center}#login form{display:flex;flex-direction:column;gap:10px;text-align:left}
.err{color:var(--bad);min-height:1.2em;font-size:13px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(760px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}
.fg h3{grid-column:1/-1;margin:8px 0 0;font-size:12px;color:var(--mute);text-transform:uppercase}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mute)}
canvas{max-height:280px}.hide{display:none!important}
</style>
</head>
<body>
<div id="login" class="card hide">
  <h1 id="ltitle" style="font-size:18px"></h1>
  <form id="lform">
    <label>Email<input id="em" type="email" required autocomplete="username"></label>
    <label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Sign in</button><div class="err" id="lerr"></div>
  </form>
</div>

<div id="app" class="hide">
<header>
  <h1 id="title"></h1>
  <nav><button data-tab="ov" class="on">Overview</button><button data-tab="rec">Records</button></nav>
  <input id="qs" placeholder="Search PR / complaint / any text" style="max-width:190px;padding:5px 8px;font-size:12px"><button class="btn sec" id="emgbtn" type="button">🚨 Emergency</button><span class="pill" id="who"></span><button class="btn sec" id="out">Sign out</button>
</header>
<div id="emgbar" class="hide" style="background:#c62828;color:#fff;padding:8px 14px;font-size:14px"></div>
<main>
 <section id="t-ov">
  <div class="card"><div class="row">
    <label>PR from<input type="date" id="f_from"></label><label>PR to<input type="date" id="f_to"></label>
    <button class="btn" id="f_go">Apply</button><button class="btn sec" id="f_all">All dates</button>
  </div></div>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h2>Workshop summary</h2><div class="tw"><table id="tbl_ws"></table></div></div>
  <div class="grid2">
    <div class="card"><h2>Pipeline stage</h2><canvas id="c_stage"></canvas></div>
    <div class="card"><h2>PR received vs replaced – by month</h2><canvas id="c_month"></canvas></div>
    <div class="card"><h2>Capacity-wise PR received</h2><div class="tw"><table id="tbl_cap"></table></div></div>
    <div class="card"><h2>Top causes of damage</h2><canvas id="c_cause"></canvas></div>
  </div>
  <div class="card"><h2>Division summary</h2><div class="tw"><table id="tbl_div"></table></div></div>
 </section>

 <section id="t-rec" class="hide">
  <div class="card">
   <div class="row">
    <label>Search<input id="q" placeholder="PR / DID / feeder / substation / place" style="min-width:260px"></label>
    <label>Workshop<select id="r_ws"><option value="">All</option><option>AZAMGARH</option><option>MAU</option><option>BALLIA</option></select></label>
    <label>Stage<select id="r_stage"><option value="">All</option></select></label>
    <label>kVA<select id="r_cap"><option value="">All</option><option>10</option><option>16</option><option>25</option><option>63</option><option>100</option><option>160</option><option>250</option><option>400</option><option>630</option></select></label>
    <label>PR from<input type="date" id="r_from"></label><label>PR to<input type="date" id="r_to"></label>
    <button class="btn" id="r_go">Search</button>
    <button class="btn sec" id="r_csv">Export CSV</button>
    <button class="btn sec editonly hide" id="r_new">+ New PR</button>
   </div>
   <div class="tw"><table id="tbl_rec"></table></div>
   <div class="pager"><span id="pinfo"></span><button class="btn sec" id="pp">‹ Prev</button><button class="btn sec" id="pn">Next ›</button></div>
  </div>
 </section>
</main>
</div>

<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="extras.js"></script>
</body>
</html>
